spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/autocompany
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

ai:
  models:
    ollama:
      base-url: http://localhost:11434
    openai:
      api-key: ${OPENAI_API_KEY}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    default:
      local-model: llama3:8b
      fallback-model: gpt-4o-mini

logging:
  level:
    root: INFO
    com.autocompany: DEBUG