spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/autocompany
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true   # legacy ddl-auto=update DB를 baseline 처리; 새 DB는 V1부터 실행
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

ai:
  models:
    ollama:
      base-url: http://localhost:11434
    openai:
      api-key: ${OPENAI_API_KEY}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    default:
      local-model: llama3:8b
      fallback-model: gpt-4o-mini
    grade:
      selection-mode: priority  # priority | task_based | budget_optimized

clarification:
  max_questions_per_session: 5
  review_chain_roles: [PLANNER, ARCHITECT, QA_ENGINEER, SECURITY_DEVOPS, PROJECT_MANAGER] # §28.4 체인 상수(REQ-003)
  allow_other_by_default: true
  expert_signal_sources: [goal_text, question_answers_free_text, client_extra_note, goal_attachments, client_relayed]
  allow_user_opened_sessions: true      # §28.6 동시 open|waiting_client 1개; 초과 409
  attachments: { max_count_per_goal: 10, max_file_size_mb: 50, native_formats: [md, txt, csv, json, pdf], parser_formats: [xlsx, pptx, docx, hwp], image_requires_vision: true } # REQ-004

logging:
  level:
    root: INFO
    com.autocompany: DEBUG